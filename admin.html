<!DOCTYPE html>
<html lang="en">
<head>
<title>Blog Admin | Creative Oracle</title>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@800&display=swap" rel="stylesheet"/>
<!-- Quill Rich Text Editor -->
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #D41920;
    --red-dark: #b5151b;
    --blue: #1A3CFF;
    --bg: #0d0d14;
    --bg2: #13131f;
    --bg3: #1a1a2e;
    --border: rgba(255,255,255,0.08);
    --text: #ffffff;
    --text2: rgba(255,255,255,0.65);
    --text3: rgba(255,255,255,0.4);
    --success: #22c55e;
    --danger: #ef4444;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    background: radial-gradient(ellipse at 50% 0%, rgba(212,25,32,0.15) 0%, transparent 70%), var(--bg);
  }
  .login-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3rem 2.5rem;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .login-logo {
    width: 50px;
    height: 50px;
    background: var(--red);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0 auto 1.5rem;
    font-family: 'Manrope', sans-serif;
  }
  .login-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; }
  .login-sub { color: var(--text3); font-size: 0.95rem; margin-bottom: 2rem; }
  .login-error { color: var(--danger); font-size: 0.9rem; margin-top: 0.75rem; display: none; }

  /* ── ADMIN LAYOUT ── */
  #admin-screen { display: none; }

  .admin-header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .admin-header h1 {
    font-size: 1.2rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .admin-logo-dot {
    width: 30px;
    height: 30px;
    background: var(--red);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 800;
    font-family: 'Manrope', sans-serif;
  }
  .logout-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text2);
    font-size: 0.85rem;
    padding: 0.45rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }

  .admin-body {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 2rem;
    max-width: 1300px;
    margin: 0 auto;
    padding: 2rem;
  }

  @media (max-width: 900px) {
    .admin-body { grid-template-columns: 1fr; }
  }

  /* ── EDITOR PANEL ── */
  .editor-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .editor-panel-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .editor-panel-title { font-size: 1rem; font-weight: 600; }
  .editor-panel-body { padding: 1.5rem; }

  /* ── FORM CONTROLS ── */
  .form-group { margin-bottom: 1.5rem; }
  .form-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-control {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    padding: 0.75rem 1rem;
    transition: border-color 0.2s;
    outline: none;
  }
  .form-control:focus { border-color: var(--red); }
  .form-control::placeholder { color: var(--text3); }
  select.form-control option { background: var(--bg3); }

  /* Image preview */
  .image-preview-wrap {
    margin-top: 0.75rem;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg3);
    border: 1px dashed var(--border);
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text3);
    font-size: 0.9rem;
  }
  .image-preview-wrap img {
    width: 100%;
    max-height: 180px;
    object-fit: cover;
    display: block;
  }

  /* Quill editor */
  .quill-wrap {
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .ql-toolbar.ql-snow {
    background: var(--bg3);
    border: none;
    border-bottom: 1px solid var(--border);
  }
  .ql-container.ql-snow {
    background: var(--bg3);
    border: none;
    min-height: 300px;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
  }
  .ql-editor { color: var(--text); min-height: 300px; }
  .ql-editor.ql-blank::before { color: var(--text3); font-style: normal; }
  .ql-snow .ql-stroke { stroke: var(--text2); }
  .ql-snow .ql-fill { fill: var(--text2); }
  .ql-snow .ql-picker { color: var(--text2); }
  .ql-snow .ql-picker-options { background: var(--bg3); border-color: var(--border); }

  /* Publish button */
  .publish-btn {
    width: 100%;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Manrope', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    padding: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .publish-btn:hover { background: var(--red-dark); transform: translateY(-1px); box-shadow: 0 8px 25px rgba(212,25,32,0.35); }
  .publish-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

  .update-btn {
    width: 100%;
    background: transparent;
    color: var(--blue);
    border: 1px solid var(--blue);
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 0.75rem;
  }
  .update-btn:hover { background: var(--blue); color: #fff; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.5rem;
    font-size: 0.95rem;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 9999;
    max-width: 360px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  /* Published URL box */
  .url-box {
    background: rgba(34,197,94,0.08);
    border: 1px solid rgba(34,197,94,0.3);
    border-radius: 10px;
    padding: 1rem;
    margin-top: 1rem;
    display: none;
  }
  .url-box p { font-size: 0.8rem; color: var(--text3); margin-bottom: 0.4rem; }
  .url-box a {
    color: var(--success);
    font-size: 0.9rem;
    word-break: break-all;
    text-decoration: none;
    font-weight: 500;
  }
  .url-box a:hover { text-decoration: underline; }

  /* ── POSTS LIST PANEL ── */
  .posts-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    height: fit-content;
  }
  .posts-panel-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .posts-panel-title { font-size: 1rem; font-weight: 600; }
  .posts-count {
    background: var(--red);
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
  }
  .posts-list { max-height: 70vh; overflow-y: auto; }
  .post-item {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    cursor: pointer;
  }
  .post-item:hover { background: var(--bg3); }
  .post-item:last-child { border-bottom: none; }
  .post-item-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 0.3rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .post-item-meta {
    font-size: 0.8rem;
    color: var(--text3);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .post-item-badge {
    font-size: 0.72rem;
    background: rgba(212,25,32,0.1);
    color: var(--red);
    padding: 0.15rem 0.5rem;
    border-radius: 6px;
    font-weight: 600;
    white-space: nowrap;
  }
  .post-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .btn-edit, .btn-delete, .btn-view {
    font-size: 0.75rem;
    padding: 0.25rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }
  .btn-edit { color: var(--blue); border-color: var(--blue); background: transparent; }
  .btn-edit:hover { background: var(--blue); color: #fff; }
  .btn-view { color: var(--success); border-color: var(--success); background: transparent; }
  .btn-view:hover { background: var(--success); color: #fff; }
  .btn-delete { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn-delete:hover { background: var(--danger); color: #fff; }

  .posts-empty {
    padding: 3rem 1.5rem;
    text-align: center;
    color: var(--text3);
    font-size: 0.9rem;
  }

  /* Generic input styles for login */
  .login-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    padding: 0.85rem 1.1rem;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 0.75rem;
  }
  .login-input:focus { border-color: var(--red); }
  .login-btn {
    width: 100%;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'Manrope', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    padding: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .login-btn:hover { background: var(--red-dark); }

  /* Mode indicator */
  .mode-badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 0.2rem 0.6rem;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .mode-new { background: rgba(212,25,32,0.15); color: var(--red); }
  .mode-edit { background: rgba(26,60,255,0.15); color: var(--blue); }
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">CO</div>
    <h1 class="login-title">Admin Panel</h1>
    <p class="login-sub">Enter your password to access the blog manager</p>
    <input type="password" id="password-input" class="login-input" placeholder="Enter admin password" onkeydown="if(event.key==='Enter') doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Login →</button>
    <p class="login-error" id="login-error">❌ Incorrect password. Try again.</p>
  </div>
</div>

<!-- ── ADMIN ── -->
<div id="admin-screen">
  <header class="admin-header">
    <h1>
      <div class="admin-logo-dot">CO</div>
      Blog Manager
    </h1>
    <button class="logout-btn" onclick="doLogout()">Logout</button>
  </header>

  <div class="admin-body">
    <!-- Editor -->
    <div class="editor-panel">
      <div class="editor-panel-header">
        <span class="editor-panel-title">
          <span id="form-mode-badge" class="mode-badge mode-new">New Post</span>
          &nbsp;Write Blog Post
        </span>
        <button style="background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:0.85rem;" onclick="resetForm()" title="Clear form">✕ Clear</button>
      </div>
      <div class="editor-panel-body">
        <input type="hidden" id="editing-post-id"/>

        <div class="form-group">
          <label class="form-label">Blog Title *</label>
          <input type="text" id="post-title" class="form-control" placeholder="e.g. 5 SEO Strategies That Actually Work in 2026"/>
        </div>

        <div class="form-group">
          <label class="form-label">One-line Summary (for SEO)</label>
          <input type="text" id="post-excerpt" class="form-control" placeholder="A short description shown on the blog listing page..."/>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div class="form-group">
            <label class="form-label">Category</label>
            <select id="post-category" class="form-control">
              <option value="MARKETING INSIGHTS">Marketing Insights</option>
              <option value="SEO">SEO</option>
              <option value="META ADS">Meta Ads</option>
              <option value="GOOGLE ADS">Google Ads</option>
              <option value="AI AUTOMATION">AI Automation</option>
              <option value="LEAD GENERATION">Lead Generation</option>
              <option value="WEB DESIGN">Web Design</option>
              <option value="BRANDING">Branding</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Read Time</label>
            <input type="text" id="post-readtime" class="form-control" placeholder="e.g. 5 min read"/>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Cover Image URL</label>
          <input type="url" id="post-image" class="form-control" placeholder="Paste image link (Google Drive, Cloudinary, etc.)" oninput="previewImage(this.value)"/>
          <div class="image-preview-wrap" id="image-preview">
            <span>Image preview will appear here</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Content *</label>
          <div class="quill-wrap">
            <div id="quill-editor"></div>
          </div>
        </div>

        <div class="url-box" id="url-box">
          <p>✅ Published! Your blog post is live at:</p>
          <a id="url-box-link" href="#" target="_blank"></a>
        </div>

        <div style="display:flex;flex-direction:column;gap:0.75rem;margin-top:1.5rem;">
          <button class="publish-btn" id="publish-btn" onclick="publishPost()">
            🚀 Publish Blog Post
          </button>
          <button class="update-btn" id="update-btn" onclick="updatePost()" style="display:none;">
            💾 Save Changes
          </button>
        </div>
      </div>
    </div>

    <!-- Posts List -->
    <div class="posts-panel">
      <div class="posts-panel-header">
        <span class="posts-panel-title">Published Posts</span>
        <span class="posts-count" id="posts-count">0</span>
      </div>
      <div class="posts-list" id="posts-list">
        <div class="posts-empty">No posts yet.<br/>Write your first blog post! ✍️</div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Quill JS -->
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
  import { getFirestore, collection, addDoc, getDocs, doc, getDoc, updateDoc, deleteDoc, serverTimestamp, orderBy, query } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';

  // ── FIREBASE CONFIG ──
  const firebaseConfig = {
    apiKey: "AIzaSyD-Vdf5BJXxPzzjXWDzsZi2mOpc_w8E_Ic",
    authDomain: "creative-oracle.firebaseapp.com",
    projectId: "creative-oracle",
    storageBucket: "creative-oracle.firebasestorage.app",
    messagingSenderId: "81799914862",
    appId: "1:81799914862:web:1b7b4fd83560bf20448d7f"
  };

  const ADMIN_PASSWORD = "CO@admin2026"; // ← Change this password!

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ── Init Quill ──
  const quill = new Quill('#quill-editor', {
    theme: 'snow',
    placeholder: 'Write your blog content here... Use headings, bold text, bullet points, and links.',
    modules: {
      toolbar: [
        [{ header: [2, 3, false] }],
        ['bold', 'italic', 'underline'],
        [{ list: 'ordered' }, { list: 'bullet' }],
        ['link', 'blockquote'],
        ['clean']
      ]
    }
  });
  window.quill = quill;

  // ── Login ──
  window.doLogin = function() {
    const pw = document.getElementById('password-input').value;
    if (pw === ADMIN_PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'block';
      loadPosts();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  };

  window.doLogout = function() {
    document.getElementById('admin-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('password-input').value = '';
    document.getElementById('login-error').style.display = 'none';
  };

  // ── Toast ──
  window.showToast = function(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => { t.className = 'toast'; }, 3500);
  };

  // ── Image Preview ──
  window.previewImage = function(url) {
    const wrap = document.getElementById('image-preview');
    if (url) {
      wrap.innerHTML = `<img src="${url}" alt="Preview" onerror="this.parentElement.innerHTML='<span>❌ Could not load image</span>'"/>`;
    } else {
      wrap.innerHTML = '<span>Image preview will appear here</span>';
    }
  };

  // ── Reset Form ──
  window.resetForm = function() {
    document.getElementById('editing-post-id').value = '';
    document.getElementById('post-title').value = '';
    document.getElementById('post-excerpt').value = '';
    document.getElementById('post-image').value = '';
    document.getElementById('post-readtime').value = '';
    document.getElementById('post-category').value = 'MARKETING INSIGHTS';
    quill.setContents([]);
    document.getElementById('image-preview').innerHTML = '<span>Image preview will appear here</span>';
    document.getElementById('url-box').style.display = 'none';
    document.getElementById('publish-btn').style.display = 'block';
    document.getElementById('update-btn').style.display = 'none';
    document.getElementById('form-mode-badge').className = 'mode-badge mode-new';
    document.getElementById('form-mode-badge').textContent = 'New Post';
  };

  // ── Publish Post ──
  window.publishPost = async function() {
    const title = document.getElementById('post-title').value.trim();
    const content = quill.root.innerHTML.trim();
    if (!title) { showToast('Please enter a title!', 'error'); return; }
    if (!content || content === '<p><br></p>') { showToast('Please write some content!', 'error'); return; }

    const btn = document.getElementById('publish-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Publishing...';

    try {
      const docRef = await addDoc(collection(db, 'blogs'), {
        title,
        excerpt: document.getElementById('post-excerpt').value.trim(),
        category: document.getElementById('post-category').value,
        imageUrl: document.getElementById('post-image').value.trim(),
        readTime: document.getElementById('post-readtime').value.trim() || '5 min read',
        content,
        publishedAt: serverTimestamp(),
        status: 'published'
      });

      const liveUrl = `${window.location.origin}/blog-post.html?id=${docRef.id}`;
      const urlBox = document.getElementById('url-box');
      const urlLink = document.getElementById('url-box-link');
      urlBox.style.display = 'block';
      urlLink.href = liveUrl;
      urlLink.textContent = liveUrl;

      showToast('✅ Blog post published!', 'success');
      loadPosts();
    } catch (err) {
      showToast('❌ Error: ' + err.message, 'error');
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = '🚀 Publish Blog Post';
    }
  };

  // ── Load all posts ──
  async function loadPosts() {
    const listEl = document.getElementById('posts-list');
    const countEl = document.getElementById('posts-count');
    listEl.innerHTML = '<div class="posts-empty">Loading posts...</div>';

    try {
      const q = query(collection(db, 'blogs'), orderBy('publishedAt', 'desc'));
      const snapshot = await getDocs(q);

      if (snapshot.empty) {
        listEl.innerHTML = '<div class="posts-empty">No posts yet.<br/>Write your first blog post! ✍️</div>';
        countEl.textContent = '0';
        return;
      }

      countEl.textContent = snapshot.size;
      listEl.innerHTML = '';
      snapshot.forEach(docSnap => {
        const post = docSnap.data();
        const id = docSnap.id;
        const date = post.publishedAt ? post.publishedAt.toDate().toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'}) : 'Unpublished';
        const item = document.createElement('div');
        item.className = 'post-item';
        item.innerHTML = `
          <div class="post-item-title">${post.title || 'Untitled'}</div>
          <div class="post-item-meta">
            <span>${date}</span>
            <span class="post-item-badge">${post.category || ''}</span>
          </div>
          <div class="post-actions">
            <button class="btn-view" onclick="viewPost('${id}')">👁 View</button>
            <button class="btn-edit" onclick="editPost('${id}')">✏️ Edit</button>
            <button class="btn-delete" onclick="deletePost('${id}', this)">🗑 Delete</button>
          </div>
        `;
        listEl.appendChild(item);
      });
    } catch (err) {
      listEl.innerHTML = `<div class="posts-empty">Error loading posts: ${err.message}</div>`;
    }
  }

  // ── View ──
  window.viewPost = function(id) {
    window.open(`/blog-post.html?id=${id}`, '_blank');
  };

  // ── Edit ──
  window.editPost = async function(id) {
    try {
      const docSnap = await getDoc(doc(db, 'blogs', id));
      if (!docSnap.exists()) { showToast('Post not found', 'error'); return; }
      const post = docSnap.data();
      document.getElementById('editing-post-id').value = id;
      document.getElementById('post-title').value = post.title || '';
      document.getElementById('post-excerpt').value = post.excerpt || '';
      document.getElementById('post-image').value = post.imageUrl || '';
      document.getElementById('post-readtime').value = post.readTime || '';
      document.getElementById('post-category').value = post.category || 'MARKETING INSIGHTS';
      quill.root.innerHTML = post.content || '';
      if (post.imageUrl) previewImage(post.imageUrl);
      document.getElementById('url-box').style.display = 'none';
      document.getElementById('publish-btn').style.display = 'none';
      document.getElementById('update-btn').style.display = 'block';
      document.getElementById('form-mode-badge').className = 'mode-badge mode-edit';
      document.getElementById('form-mode-badge').textContent = 'Editing';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      showToast('Error loading post: ' + err.message, 'error');
    }
  };

  // ── Update ──
  window.updatePost = async function() {
    const id = document.getElementById('editing-post-id').value;
    if (!id) return;
    const title = document.getElementById('post-title').value.trim();
    const content = quill.root.innerHTML.trim();
    if (!title) { showToast('Title required!', 'error'); return; }

    const btn = document.getElementById('update-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Saving...';

    try {
      await updateDoc(doc(db, 'blogs', id), {
        title,
        excerpt: document.getElementById('post-excerpt').value.trim(),
        category: document.getElementById('post-category').value,
        imageUrl: document.getElementById('post-image').value.trim(),
        readTime: document.getElementById('post-readtime').value.trim() || '5 min read',
        content,
      });
      showToast('✅ Post updated!', 'success');
      resetForm();
      loadPosts();
    } catch (err) {
      showToast('❌ Error: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '💾 Save Changes';
    }
  };

  // ── Delete ──
  window.deletePost = async function(id, btn) {
    if (!confirm('Delete this post? This cannot be undone.')) return;
    try {
      await deleteDoc(doc(db, 'blogs', id));
      showToast('🗑 Post deleted.', 'success');
      loadPosts();
    } catch (err) {
      showToast('❌ Error: ' + err.message, 'error');
    }
  };

</script>
</body>
</html>
